services:
  engine:
    build:
      context: .
      args:
        DOCKER_LIBRARY: ${DOCKER_LIBRARY:-public.ecr.aws/docker/library}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - engine-data:/var/lib/ai-scan-engine
      - ../plugin-raw/.github/skills/security-baseline-review:/skills/security-baseline-review:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  engine-data:
