    <marker id="arrowSkill" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#89a879"/></marker>
    <style>
      .plane{fill:#0c1c2b;stroke:#31506a;stroke-width:2;rx:18;filter:url(#glow)}
