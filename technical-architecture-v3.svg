      .shared{fill:#101f22;stroke:#52715e;stroke-width:2;stroke-dasharray:9 7;rx:18}
      .node{fill:#102638;stroke:#55778f;stroke-width:1.7;rx:10}
      .nodeCyan{fill:#102b3a;stroke:#5e9bad;stroke-width:1.8;rx:10}
      .nodeAmber{fill:#2b281f;stroke:#9a835d;stroke-width:1.8;rx:10}
      .nodeTeal{fill:#102c2c;stroke:#589085;stroke-width:1.8;rx:10}
      .nodeViolet{fill:#22243a;stroke:#777ba5;stroke-width:1.8;rx:10}
      .nodeGreen{fill:#1b2b22;stroke:#708d66;stroke-width:1.8;rx:10}
      .external{fill:#111b27;stroke:#526273;stroke-width:1.6;rx:10}
      .planeTitle{font:600 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#b8ccda;letter-spacing:.4px}
      .section{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#83a6bb;letter-spacing:.4px}
      .label{font:500 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#d4e0e8;text-anchor:middle;dominant-baseline:middle}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#9cb2c1;text-anchor:middle}
      .tiny{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#8ea6b5;text-anchor:middle}
      .cyan{fill:none;stroke:#63a9bd;stroke-width:2.2;marker-end:url(#arrowCyan);stroke-linejoin:round}
      .cyanBi{fill:none;stroke:#63a9bd;stroke-width:2.1;marker-start:url(#arrowCyan);marker-end:url(#arrowCyan);stroke-linejoin:round}
      .amber{fill:none;stroke:#c4a36e;stroke-width:2.3;marker-end:url(#arrowAmber);stroke-linejoin:round}
      .teal{fill:none;stroke:#68a99d;stroke-width:2.3;marker-end:url(#arrowTeal);stroke-linejoin:round}
      .tealBi{fill:none;stroke:#68a99d;stroke-width:2.1;marker-start:url(#arrowTeal);marker-end:url(#arrowTeal);stroke-linejoin:round}
      .violet{fill:none;stroke:#8e91b8;stroke-width:2.2;marker-end:url(#arrowViolet);stroke-linejoin:round}
      .skillLine{fill:none;stroke:#89a879;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrowSkill);stroke-linejoin:round}
      .data{fill:none;stroke:#688194;stroke-width:1.9;marker-end:url(#arrowCyan);stroke-linejoin:round}
      .divider{stroke:#27445a;stroke-width:1.2;stroke-dasharray:5 7}
    </style>
